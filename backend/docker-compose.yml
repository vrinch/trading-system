version: '3.8'

services:
  # Core Infrastructure
  timescaledb:
    image: timescale/timescaledb:2.13.1-pg16
    container_name: trading-timescaledb
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./shared/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - timescale_data:/var/lib/postgresql/data
    command: postgres -c shared_preload_libraries=timescaledb -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.4-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: trading-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_NUM_PARTITIONS: 8
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: trading-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: trading-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../tools/configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:10.2.3
    container_name: trading-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/k8s/prometheus-grafana/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/trading.json

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: trading-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Trading Services
  data-ingest:
    build:
      context: ./services/data-ingest
      dockerfile: Dockerfile
    container_name: trading-data-ingest
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_URL=postgresql://trading_user:trading_pass@timescaledb:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - LOG_LEVEL=INFO
      - POLYGON_API_KEY=${POLYGON_API_KEY:-demo}
      - TRADING_MODE=test
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/data-ingest/src:/app/src
    restart: unless-stopped

  strategy-engine:
    build:
      context: ./services/strategy-engine
      dockerfile: Dockerfile
    container_name: trading-strategy-engine
    ports:
      - "8002:8000"
    environment:
      - POSTGRES_URL=postgresql://trading_user:trading_pass@timescaledb:5432/trading_db
      - REDIS_URL=redis://redis:6379/1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - LOG_LEVEL=INFO
      - TRADING_MODE=test
      - ML_MODEL_PATH=/models
    depends_on:
      - timescaledb
      - redis
      - kafka
      - data-ingest
    volumes:
      - ./services/strategy-engine/src:/app/src
      - ml_models:/models
    restart: unless-stopped

  execution:
    build:
      context: ./services/execution
      dockerfile: Dockerfile
    container_name: trading-execution
    ports:
      - "8003:8080"
    environment:
      - POSTGRES_URL=postgresql://trading_user:trading_pass@timescaledb:5432/trading_db
      - REDIS_URL=redis://redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - LOG_LEVEL=info
      - TRADING_MODE=test
      - RISK_KILL_SWITCH_TOKEN=${RISK_KILL_SWITCH_TOKEN:-emergency123}
    depends_on:
      - timescaledb
      - redis
      - kafka
      - strategy-engine
    restart: unless-stopped

  ml-pipeline:
    build:
      context: ./services/ml-pipeline
      dockerfile: Dockerfile
    container_name: trading-ml-pipeline
    ports:
      - "8004:8000"
    environment:
      - POSTGRES_URL=postgresql://trading_user:trading_pass@timescaledb:5432/trading_db
      - REDIS_URL=redis://redis:6379/3
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MLFLOW_TRACKING_URI=http://localhost:5000
      - LOG_LEVEL=INFO
    depends_on:
      - timescaledb
      - redis
      - minio
    volumes:
      - ./services/ml-pipeline/src:/app/src
      - ml_models:/models
      - ml_artifacts:/artifacts
    restart: unless-stopped

  monitoring:
    build:
      context: ./services/monitoring
      dockerfile: Dockerfile
    container_name: trading-monitoring
    ports:
      - "8005:8000"
    environment:
      - POSTGRES_URL=postgresql://trading_user:trading_pass@timescaledb:5432/trading_db
      - REDIS_URL=redis://redis:6379/4
      - PROMETHEUS_URL=http://prometheus:9090
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - LOG_LEVEL=INFO
    depends_on:
      - timescaledb
      - redis
      - prometheus
    volumes:
      - ./services/monitoring/src:/app/src
    restart: unless-stopped

volumes:
  timescale_data:
  redis_data:
  prometheus_data:
  grafana_data:
  minio_data:
  ml_models:
  ml_artifacts:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16