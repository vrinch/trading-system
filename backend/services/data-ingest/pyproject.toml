[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-data-ingest"
version = "1.0.0"
description = "High-frequency market data ingestion service for algorithmic trading"
authors = [
    {name = "Trading System", email = "dev@tradingsystem.com"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Core dependencies with exact versions for reproducibility
dependencies = [
    # Web framework and async
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "asyncio-throttle==1.0.2",
    
    # Data handling and validation
    "pydantic[email]==2.5.0",
    "pydantic-settings==2.1.0",
    "numpy==1.24.3",
    "pandas==2.1.4",
    
    # Database connections
    "asyncpg==0.29.0",
    "sqlalchemy[asyncio]==2.0.23",
    "alembic==1.13.0",
    
    # Message queues and caching
    "aiokafka==0.10.0",
    "aioredis==2.0.1",
    "redis==5.0.1",
    
    # Market data providers
    "ccxt==4.1.72",
    "websockets==12.0",
    "aiohttp==3.9.1",
    "httpx==0.25.2",
    
    # Technical indicators
    "TA-Lib==0.4.28",
    "scipy==1.11.4",
    
    # Monitoring and logging
    "prometheus-client==0.19.0",
    "structlog==23.2.0",
    "python-json-logger==2.0.7",
    
    # Utilities
    "python-dotenv==1.0.0",
    "click==8.1.7",
    "pytz==2023.3",
    "orjson==3.9.10",  # Fast JSON serialization
    "msgpack==1.0.7",   # Binary serialization
    
    # AWS/Cloud integrations
    "boto3==1.34.0",
    "aiobotocore[s3]==2.11.0",
    
    # Rate limiting and retries
    "tenacity==8.2.3",
    "backoff==2.2.1",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-benchmark==4.0.0",
    "httpx==0.25.2",  # For testing API clients
    
    # Code quality
    "black==23.11.0",
    "isort==5.12.0",
    "ruff==0.1.6",
    "mypy==1.7.1",
    "bandit==1.7.5",
    
    # Type stubs
    "types-redis==4.6.0.11",
    "types-pytz==2023.3.1.1",
]

# Production dependencies
prod = [
    "psutil==5.9.6",
    "setproctitle==1.3.3",
]

# Testing dependencies
test = [
    "coverage[toml]==7.3.2",
    "factory-boy==3.3.0",
    "freezegun==1.2.2",
    "respx==0.20.2",  # Mock HTTP requests
]

[project.scripts]
data-ingest = "data_ingest.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_ingest"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude generated files
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["data_ingest"]
known_third_party = ["fastapi", "pydantic", "sqlalchemy", "ccxt"]

[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true


module = [
    "ccxt.*",
    "talib.*",
    "kafka.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests", 
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\):",
    "@(abc\.)?abstractmethod",
]
show_missing = true
precision = 2