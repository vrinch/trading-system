[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-strategy-engine"
version = "1.0.0"
description = "Advanced strategy engine for algorithmic trading with ML integration"
authors = [
    {name = "Trading System", email = "dev@tradingsystem.com"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Core dependencies with exact versions for reproducibility
dependencies = [
    # Web framework and async
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    
    # Data handling and validation
    "pydantic[email]==2.5.0",
    "pydantic-settings==2.1.0",
    "numpy==1.24.3",
    "pandas==2.1.4",
    "polars==0.20.2",  # High-performance DataFrame library
    
    # Scientific computing and statistics
    "scipy==1.11.4",
    "statsmodels==0.14.1",
    "scikit-learn==1.3.2",
    "numba==0.58.1",  # JIT compilation for performance
    
    # Technical analysis
    "TA-Lib==0.4.28",
    "pandas-ta==0.3.14b",
    "ta==0.10.2",
    
    # Machine learning frameworks
    "lightgbm==4.1.0",
    "xgboost==2.0.3",
    "catboost==1.2.2",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "transformers==4.36.2",  # For NLP/sentiment analysis
    
    # ML experiment tracking
    "mlflow==2.9.2",
    "wandb==0.16.1",
    "optuna==3.5.0",  # Hyperparameter optimization
    
    # Backtesting frameworks
    "backtrader==1.9.78.123",
    "zipline-reloaded==3.0.3",
    "vectorbt==0.25.2",  # Vectorized backtesting
    
    # Financial data and risk
    "quantlib-python==1.32",
    "PyPortfolioOpt==1.5.5",
    "riskfolio-lib==5.1.0",
    "empyrical==0.5.5",  # Performance analytics
    
    # Database connections
    "asyncpg==0.29.0",
    "sqlalchemy[asyncio]==2.0.23",
    "alembic==1.13.0",
    
    # Message queues and caching
    "aiokafka==0.10.0",
    "aioredis==2.0.1",
    "redis==5.0.1",
    
    # Monitoring and logging
    "prometheus-client==0.19.0",
    "structlog==23.2.0",
    "python-json-logger==2.0.7",
    
    # Async utilities
    "asyncio-throttle==1.0.2",
    "aiohttp==3.9.1",
    "httpx==0.25.2",
    
    # Data serialization and storage
    "orjson==3.9.10",
    "msgpack==1.0.7",
    "pyarrow==14.0.2",  # Parquet support
    "h5py==3.10.0",  # HDF5 for large datasets
    
    # Utilities
    "python-dotenv==1.0.0",
    "click==8.1.7",
    "pytz==2023.3",
    "croniter==2.0.1",  # Cron scheduling
    
    # AWS/Cloud integrations
    "boto3==1.34.0",
    "aiobotocore[s3]==2.11.0",
    
    # Rate limiting and retries  
    "tenacity==8.2.3",
    "backoff==2.2.1",
    
    # Parallel processing
    "joblib==1.3.2",
    "multiprocessing-logging==0.3.4",
    
    # Financial calculations
    "python-dateutil==2.8.2",
    "business-days==1.0.7",
    "exchange-calendars==4.5.4",
    
    # Configuration and secrets
    "pyyaml==6.0.1",
    "python-decouple==3.8",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1", 
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-benchmark==4.0.0",
    "pytest-xdist==3.5.0",  # Parallel test execution
    "pytest-timeout==2.2.0",
    
    # Code quality
    "black==23.11.0",
    "isort==5.12.0",
    "ruff==0.1.6",
    "mypy==1.7.1",
    "bandit==1.7.5",
    "pre-commit==3.6.0",
    
    # Type stubs
    "types-redis==4.6.0.11",
    "types-pytz==2023.3.1.1",
    "types-pyyaml==6.0.12.12",
    "pandas-stubs==2.1.4.231218",
    
    # Documentation
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.3",
    "mkdocstrings[python]==0.24.0",
    
    # Profiling and debugging
    "memory-profiler==0.61.0",
    "py-spy==0.3.14",
    "line-profiler==4.1.1",
]

# Production dependencies
prod = [
    "psutil==5.9.6",
    "setproctitle==1.3.3",
    "gunicorn==21.2.0",
]

# Testing dependencies
test = [
    "coverage[toml]==7.3.2",
    "factory-boy==3.3.0",
    "freezegun==1.2.2",
    "respx==0.20.2",
    "hypothesis==6.92.1",  # Property-based testing
    "pytest-mock==3.12.0",
]

# ML and research dependencies
research = [
    "jupyter==1.0.0",
    "ipykernel==6.27.1",
    "matplotlib==3.8.2",
    "seaborn==0.13.0",
    "plotly==5.17.0",
    "dash==2.16.1",  # Interactive dashboards
    "streamlit==1.29.0",  # Quick prototyping
    "shap==0.44.0",  # Model explainability
    "yellowbrick==1.5",  # ML visualization
]

[project.scripts]
strategy-engine = "strategy_engine.main:main"
backtest = "strategy_engine.cli.backtest:main"
train-model = "strategy_engine.cli.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_engine"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | notebooks
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["strategy_engine"]
known_third_party = [
    "fastapi", "pydantic", "sqlalchemy", "pandas", "numpy", 
    "sklearn", "lightgbm", "torch", "backtrader"
]

[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "S",   # bandit security
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # use of assert (OK in tests)
    "S311",  # random number generation (OK for trading)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S311"]
"notebooks/*" = ["E402", "F401", "F841"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true


module = [
    "backtrader.*",
    "zipline.*", 
    "vectorbt.*",
    "ta.*",
    "pandas_ta.*",
    "quantlib.*",
    "empyrical.*",
    "riskfolio.*",
    "exchange_calendars.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --tb=short"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "backtest: marks tests as backtesting tests",
    "ml: marks tests as machine learning tests",
    "requires_data: marks tests requiring external data",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/notebooks/*",
    "*/research/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError", 
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\):",
    "@(abc\.)?abstractmethod",
]
show_missing = true
precision = 2
skip_covered = false

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]
skips = ["B101", "B601"]  # Skip assert and shell injection (handled by ruff)

[tool.vulture]
exclude = ["tests/", "notebooks/"]
ignore_decorators = ["@app.route", "@click.command"]
ignore_names = ["args", "kwargs"]
min_confidence = 60
paths = ["src/strategy_engine"]
sort_by_size = true
verbose = false

# MLflow configuration
[tool.mlflow]
tracking_uri = "sqlite:///mlruns.db"
default_artifact_root = "./mlruns"
experiment_name = "trading_strategies"

# Optuna configuration for hyperparameter optimization
[tool.optuna]
study_name = "strategy_optimization"
storage = "sqlite:///optuna.db"
sampler = "TPESampler"
pruner = "MedianPruner"