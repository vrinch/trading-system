[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-ml-pipeline"
version = "1.0.0"
description = "ML pipeline for feature engineering, model training, validation, and deployment in quant trading"
authors = [
    {name = "Trading System", email = "dev@tradingsystem.com"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic[email]==2.5.0",
    "pydantic-settings==2.1.0",
    "numpy==1.24.3",
    "pandas==2.1.4",
    "scikit-learn==1.3.2",
    "pytorch-lightning==2.2.3",
    "torch==2.1.2",
    "xgboost==2.0.3",
    "lightgbm==4.1.0",
    "catboost==1.2.2",
    "mlflow==2.9.2",
    "optuna==3.5.0",
    "redis==5.0.1",
    "aioredis==2.0.1",
    "sqlalchemy[asyncio]==2.0.23",
    "asyncpg==0.29.0",
    "boto3==1.34.0",
    "prefect==2.14.18",
    "joblib==1.3.2",
    "featuretools==1.30.0",
    "pyarrow==14.0.2",
    "orjson==3.9.10",
    "httpx==0.25.2",
    "click==8.1.7",
    "python-dotenv==1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "isort==5.12.0",
    "ruff==0.1.6",
    "mypy==1.7.1"
]

test = [
    "freezegun==1.2.2",
    "factory-boy==3.3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipeline"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]